version: '3.8'

services:
  grobid:
    image: grobid/grobid:latest
    container_name: grobid-service
    ports:
      - "8070:8070"
    volumes:
      - grobid-cache:/opt/grobid/grobid-home
    environment:
      - JAVA_OPTS=-Xmx4g
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8070/api/isalive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  grobid-cache:
    driver: local
